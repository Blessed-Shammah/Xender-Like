name: filevault
description: "FileVault - Cross-platform file sharing mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  open_filex: ^4.4.0
  mime: ^1.0.5
  flutter_downloader: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

